[".config/bat/themes/Catppuccin Mocha.tmTheme"]
type = "file"
url = "https://raw.githubusercontent.com/catppuccin/bat/refs/heads/main/themes/Catppuccin%20Mocha.tmTheme"

[".config/glow/catppuccin-mocha.json"]
type = "file"
url = "https://raw.githubusercontent.com/catppuccin/glamour/refs/heads/main/themes/catppuccin-mocha.json"

[".config/mpv/shaders"]
type = "archive"
url = "https://github.com/classicjazz/mpv-config/archive/refs/tags/0.26.tar.gz"
exact = true
stripComponents = 2
refreshPeriod = "720h"
include = ["*/shaders/**"]

