"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 500
continuation_prompt = "[❯❯ ](subtext0)"
palette = "mocha"
follow_symlinks = false

format = """
$directory\
$shell\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$env_var \
$container \
$all \
$status\
$cmd_duration\
$jobs\
$os\
$hostname\
$line_break\
$username$character"""

# [env_var.ZMX_SESSION]
# variable = 'ZMX_SESSION'
# format = '[]($style)'
# style = 'mauve'

[profiles]
transient = """
$character\
"""

rtransient = """
$status\
$cmd_duration\
"""

claude-code = "$claude_model($git_branch )$claude_context"

[claude_context]
format = "[$input_tokens]($style) "

[claude_model]
symbol = ""

[[claude_context.display]]
threshold = 0
style = "teal"
hidden = false

[[claude_context.display]]
threshold = 35
style = "peach"
hidden = false

[[claude_context.display]]
threshold = 60
style = "red"
hidden = false

[os]
disabled = true
format = '[$symbol ](lavender)'

[fill]
disabled = false
symbol = " "

[status]
symbol = '✘ '
map_symbol = true
format = "[$symbol$status]($style) "
style = 'red'
disabled = false

[line_break]
disabled = false

[container]
format = ' [$symbol \[$name\]]($style) '
symbol = ''

[character]
# error_symbol   = "[](mauve)"
success_symbol = "[❯](peach)"
vimcmd_symbol = "[❮](peach)"

[battery]
disabled = true
full_symbol = '🔋 '
charging_symbol = '⚡️ '
discharging_symbol = '💀 '

[username]
disabled = true
aliases = { "Administrator" = '󱐋 ' }
format = '[$user]($style)'
style_root = 'mauve'
style_user = 'yellow'
# detect_env_vars = ['SSH_CONNECTION', '!SSH_CONNECTION']

[shell]
disabled = true
fish_indicator = '󰈺'
format = '[$indicator]($style)'
powershell_indicator = ''
style = 'teal'
unknown_indicator = ''
zsh_indicator = ''

[cmd_duration]
disabled = false
format = "[$duration]($style)"
style = "sapphire"

[directory]
fish_style_pwd_dir_length = 2
format = '[$path]($style)[$read_only]($read_only_style) '
read_only = " "
read_only_style = 'overlay1'
style = "blue"
truncation_length = 2
use_os_path_sep = false

[hostname]
disabled = true
ssh_only = true
format = "[$hostname]($style)"
ssh_symbol = "󰥛"
style = 'teal'

[git_state]
am = "󰲾"
bisect = "󱢇"
cherry_pick = " "
format = ' [$state( $progress_current/$progress_total)]($style)'
merge = ""
rebase = ""
revert = " "
style = "red"

[git_status]
format = "[$all_status$ahead_behind]($style) "
conflicted = '[ ~${count}](red)'
ahead = "[ ⇡${count}](green)"
behind = "[ ⇣${count}](red)"
diverged = "[ ⇕⇡${ahead_count}](teal)[⇣${behind_count}](peach)"
untracked = "[ ?${count}](blue)"
stashed = "[ *${count}](subtext0)"
modified = "[ !${count}](yellow)"
staged = "[ +${count}](sapphire)"
renamed = "[ »${count}](peach)"
deleted = "[ ✘${count}](mauve)"

[git_branch]
format = '[$symbol](overlay2)[$branch](mauve)'
symbol = ' '
truncation_length = 24
truncation_symbol = "…"
#ignore_branches = ['master','main']

[git_commit]
format = "[@$hash]($style) "
style = "green"
only_detached = true
tag_disabled = false
tag_symbol = '  '

[git_metrics]
disabled = true
added_style = "green"
deleted_style = "red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[aws]
style = 'yellow'
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'

[azure]
style = 'blue'
format = '[$symbol($subscription)]($style) '

[buf]
style = 'blue'
format = '[$symbol($version )]($style)'

[bun]
style = 'red'
format = '[$symbol($version )]($style)'

[c]
style = '149'
format = '[$symbol($version(-$name) )]($style)'

[cmake]
style = 'blue'
format = '[$symbol($version )]($style)'

[cobol]
style = 'blue'
format = '[$symbol($version )]($style)'

[conda]
style = 'green'
format = '[$symbol$environment]($style) '

[crystal]
style = 'red'
